    <meta name="description" content="Protótipo de aplicativo desktop para fichas agnósticas de RPG de mesa com identidade visual Light Cyber-Brutalism e Bento Grid modular." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var t = (localStorage.getItem('gridsheet_theme') || '').trim().toLowerCase();
          document.documentElement.dataset.theme =
            t === 'dark' || t === 'eink' || t === 'light' ? t : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Literata:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <div id="root"></div>
