name: Build & Deploy Demo (Web · Android Opt-In)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Compilar e publicar APK Android (pausado por padrão)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1. Build da Demo Web (React + Vite) e publicação no GitHub Pages
  deploy-web:
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipagem TypeScript
        run: npm run lint

      - name: Executar testes unitários (Vitest)
        run: npm run test:vitest

      - name: Executar testes unitários (node:test)
        run: npm run test:node

      - name: Gerar build estático (Vite)
        run: npx vite build --base=/rpg-sheet-builder/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload do artefato Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # 2. Compilação do APK Android (Gradle 8.10.2 / JDK 17)
  build-android:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_android == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Executar testes unitários (JUnit)
        working-directory: ./android
        run: gradle testDebugUnitTest --no-daemon

      - name: Compilar APK Debug
        working-directory: ./android
        run: gradle assembleDebug --no-daemon

      - name: Anexar APK como artefato do build
        uses: actions/upload-artifact@v7
        with:
          name: gridsheet-demo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK na Release (latest-demo)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-demo
          name: GridSheet Demo (Web & APK)
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
