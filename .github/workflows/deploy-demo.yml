name: Build & Deploy Demo (Web + Android APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1. Build da Demo Web (React + Vite) e publicação no GitHub Pages
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Gerar build estático (Vite)
        run: npx vite build --base=/rpg-sheet-builder/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Compilação do APK Android (Gradle 8.10.2 / JDK 17)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK Debug
        working-directory: ./android
        run: gradle assembleDebug --no-daemon

      - name: Anexar APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: gridsheet-demo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK na Release (latest-demo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-demo
          name: GridSheet Demo (Web & APK)
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
